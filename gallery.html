<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏠 フォトギャラリー｜ゲストハウスRion</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --cream: #FFF8EE;
  --sage: #7FAF8A;
  --sage-light: #C2DEC8;
  --terracotta: #D4634A;
  --brown: #5C3D2E;
  --brown-light: #8B6355;
  --mustard: #E8B84B;
}
body { background: var(--cream); font-family: "Klee One", cursive; color: var(--brown); }

.header {
  background: var(--sage);
  padding: 40px 24px 54px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.header::after {
  content: "";
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 30px;
  background: var(--cream);
  clip-path: ellipse(55% 100% at 50% 100%);
}
.header-tag { font-family: "Caveat", cursive; font-size: 13px; letter-spacing: 0.25em; color: rgba(255,255,255,0.75); margin-bottom: 10px; }
.header-title { font-family: "Caveat", cursive; font-size: clamp(36px, 8vw, 58px); font-weight: 700; color: white; line-height: 1.1; }
.header-title span { color: var(--mustard); }
.header-sub { font-size: 13px; color: rgba(255,255,255,0.8); margin-top: 10px; }

.body { max-width: 700px; margin: 0 auto; padding: 28px 16px 60px; }

.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: "Caveat", cursive; font-size: 17px; color: var(--sage);
  text-decoration: none; margin-bottom: 20px; padding: 6px 14px;
  background: white; border-radius: 20px; border: 1.5px solid var(--sage-light);
  box-shadow: 2px 3px 0 rgba(92,61,46,0.07);
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.gallery-item {
  position: relative; border-radius: 14px; overflow: hidden;
  background: #E8DDD0; box-shadow: 3px 4px 0 rgba(92,61,46,0.1);
  cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  aspect-ratio: 4/3;
}
.gallery-item[style*="span 2"] { aspect-ratio: 16/9; }
.gallery-item:hover { transform: scale(1.02) rotate(0.3deg); box-shadow: 5px 6px 0 rgba(92,61,46,0.15); }
.gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

.gallery-label {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(to top, rgba(60,35,20,0.75), transparent);
  padding: 24px 12px 10px;
}
.gl-title { font-family: "Caveat", cursive; font-size: 17px; font-weight: 700; color: white; }
.gl-desc { font-size: 11px; color: rgba(255,255,255,0.85); margin-top: 2px; }

/* LIGHTBOX */
.lightbox {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.93); z-index: 1000;
  align-items: center; justify-content: center; padding: 16px;
}
.lightbox.active { display: flex; flex-direction: column; }
.lb-inner { position: relative; }
.lb-img { max-width: 90vw; max-height: 78vh; border-radius: 12px; object-fit: contain; display: block; }
.lb-close {
  position: absolute; top: -40px; right: 0;
  color: white; font-size: 26px; cursor: pointer;
  font-family: "Caveat", cursive; background: none; border: none; padding: 4px 10px;
}
.lb-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: rgba(255,255,255,0.15); color: white; border: none;
  font-size: 28px; width: 44px; height: 44px; border-radius: 50%;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.lb-nav:hover { background: rgba(255,255,255,0.3); }
.lb-prev { left: -54px; }
.lb-next { right: -54px; }
.lb-caption {
  text-align: center; margin-top: 14px;
  font-family: "Caveat", cursive;
}
.lb-caption-title { font-size: 20px; font-weight: 700; color: white; }
.lb-caption-desc { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 2px; }
.lb-counter { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }

.footer {
  background: var(--sage); text-align: center;
  padding: 30px 20px; color: rgba(255,255,255,0.8); font-size: 13px;
}
.footer-title { font-family: "Caveat", cursive; font-size: 26px; color: white; margin-bottom: 6px; }
</style>
</head>

const imgs = document.querySelectorAll(".gallery-item img");
let current = 0;

function openLightbox(i) {
  current = i;
  document.getElementById("lb-img").src = imgs[i].src;
  updateCaption();
  document.getElementById("lightbox").classList.add("active");
  document.body.style.overflow = "hidden";
}

function updateCaption() {
  document.getElementById("lb-title").textContent = photos[current].label;
  document.getElementById("lb-desc").textContent = photos[current].desc;
  document.getElementById("lb-counter").textContent = (current + 1) + " / " + photos.length;
}

function closeLightboxBtn() {
  document.getElementById("lightbox").classList.remove("active");
  document.body.style.overflow = "";
}

function closeLightbox(e) {
  if (e.target === document.getElementById("lightbox")) closeLightboxBtn();
}

function changePhoto(dir) {
  current = (current + dir + photos.length) % photos.length;
  document.getElementById("lb-img").src = imgs[current].src;
  updateCaption();
}

let touchStartX = 0;
document.getElementById("lightbox").addEventListener("touchstart", e => { touchStartX = e.touches[0].clientX; });
document.getElementById("lightbox").addEventListener("touchend", e => {
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 50) changePhoto(diff > 0 ? 1 : -1);
});
</script>
